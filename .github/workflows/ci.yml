name: CI

# מריץ אוטומטית את כל הבדיקות על כל Pull Request ועל push ל-main.
on:
  push:
    branches: [main]
  pull_request:

# מבטל ריצה קודמת של אותו ref כשמגיע push חדש (חוסך זמן CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (customer-risk-rating)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-risk-rating
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customer-risk-rating/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
