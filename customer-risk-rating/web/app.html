<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>דירוג סיכון לקוח</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --brand: #1d4ed8; --brand-ink: #1e3a8a;
    --approve: #16a34a; --review: #d97706; --reject: #dc2626;
    --shadow: 0 10px 30px rgba(15,23,42,.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif; line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  header h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0 0 20px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  select, input[type=number] { width: 100%; padding: 11px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .row-full { grid-column: 1 / -1; }
  .checkbox { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
  .checkbox input { width: 18px; height: 18px; }
  button { grid-column: 1 / -1; padding: 13px; font-size: 1.05rem; font-weight: 600;
    color: #fff; background: var(--brand); border: 0; border-radius: 10px; cursor: pointer; }
  button:hover { background: var(--brand-ink); }
  button:disabled { opacity: .6; cursor: default; }

  .result { display: none; }
  .headline { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .score-num { font-size: 3.2rem; font-weight: 800; line-height: 1; }
  .score-num small { font-size: 1.1rem; color: var(--muted); font-weight: 500; }
  .badge { padding: 8px 16px; border-radius: 999px; font-weight: 700; color: #fff; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: .95rem; margin-inline-start: auto; text-align: start; }
  .meta b { color: var(--ink); }

  .scale { position: relative; height: 14px; border-radius: 999px; margin: 22px 0 8px;
    background: linear-gradient(90deg, var(--approve) 0 30%, var(--review) 30% 60%, var(--reject) 60% 100%); }
  /* RTL: 1 (low risk) on the right, 10 (high risk) on the left */
  .marker { position: absolute; top: -6px; width: 4px; height: 26px; background: #0f172a;
    border-radius: 2px; transform: translateX(2px); box-shadow: 0 0 0 3px #fff; }
  .scale-legend { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }

  h3 { margin: 24px 0 12px; font-size: 1.05rem; }
  .crit { padding: 10px 0; border-top: 1px solid var(--line); }
  .crit-top { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
  .crit-name { font-weight: 600; }
  .crit-val { color: var(--muted); }
  .bar { height: 9px; background: #eef2f7; border-radius: 999px; margin-top: 7px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; }
  .crit-foot { font-size: .78rem; color: var(--muted); margin-top: 5px; display: flex; justify-content: space-between; }
  .miss { color: var(--reject); }

  .explain { margin-top: 22px; background: #f8fafc; border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; white-space: pre-wrap; font-size: .95rem; }
  .explain h3 { margin-top: 0; }
  .err { display: none; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 8px; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } .meta { margin-inline-start: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>דירוג סיכון לקוח 🛡️</h1>
    <p>המערכת שואבת את כל נתוני הלקוח מטבלאות החברה ומחזירה ציון סיכון והחלטה — תוך שנייה.</p>
  </header>

  <div class="card">
    <div class="err" id="err"></div>
    <form id="form">
      <div>
        <label for="customer">לקוח</label>
        <select id="customer"><option>טוען…</option></select>
      </div>
      <div>
        <label for="amount">סכום ההלוואה המבוקש (₪)</label>
        <input type="number" id="amount" value="100000" min="1000" step="1000" />
      </div>
      <div class="row-full checkbox">
        <input type="checkbox" id="use_ai" />
        <label for="use_ai" style="margin:0">הוספת חוות דעת חיתום מבוססת-AI (Claude) — אם מוגדר מפתח API</label>
      </div>
      <button type="submit" id="submit">חשב דירוג סיכון</button>
    </form>
  </div>

  <div class="card result" id="result">
    <div class="headline">
      <div class="score-num"><span id="score">–</span><small>/10</small></div>
      <span class="badge" id="badge">–</span>
      <div class="meta">
        <div><b id="rname">–</b> · <span id="rid"></span></div>
        <div>סכום מבוקש: <b id="ramount">–</b></div>
      </div>
    </div>

    <div class="scale"><div class="marker" id="marker"></div></div>
    <div class="scale-legend">
      <span>סיכון גבוה · 10</span><span>6</span><span>3</span><span>1 · סיכון נמוך</span>
    </div>

    <h3>פירוט לפי קריטריון</h3>
    <div id="breakdown"></div>

    <div class="explain" id="explainBox" style="display:none">
      <h3>חוות דעת</h3>
      <div id="explainText"></div>
    </div>
  </div>

  <footer>מנוע דירוג דטרמיניסטי ומבוקר · הנתונים לדוגמה בלבד</footer>
</div>

<script>
const DECISION = {
  approve: { color: "var(--approve)" },
  review:  { color: "var(--review)" },
  reject:  { color: "var(--reject)" },
};
function riskColor(r) { return r <= 3 ? "var(--approve)" : r <= 6 ? "var(--review)" : "var(--reject)"; }
function fmtAmount(n) { return Number(n).toLocaleString("he-IL") + " ₪"; }

async function loadCustomers() {
  const sel = document.getElementById("customer");
  try {
    const res = await fetch("api/customers");
    const data = await res.json();
    sel.innerHTML = "";
    for (const c of data.customers) {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = `${c.name} (${c.id})`;
      sel.appendChild(o);
    }
  } catch (e) { sel.innerHTML = "<option>שגיאה בטעינה</option>"; }
}

function showError(msg) {
  const el = document.getElementById("err");
  el.textContent = msg; el.style.display = "block";
}

function render(d) {
  document.getElementById("err").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("score").textContent = d.score.toFixed(1);
  document.getElementById("rname").textContent = d.full_name;
  document.getElementById("rid").textContent = d.customer_id;
  document.getElementById("ramount").textContent = fmtAmount(d.requested_amount);

  const badge = document.getElementById("badge");
  badge.textContent = d.decision.label_he;
  badge.style.background = (DECISION[d.decision.id] || {}).color || "#334155";

  // RTL scale: 1 on the right, 10 on the left -> offset from the right edge.
  const pct = (d.score - 1) / 9 * 100;
  document.getElementById("marker").style.right = pct + "%";

  const bd = document.getElementById("breakdown");
  bd.innerHTML = "";
  const rows = [...d.breakdown].sort((a, b) => b.contribution - a.contribution);
  for (const c of rows) {
    const val = c.missing ? "— חסר נתון" : c.raw_value;
    const div = document.createElement("div");
    div.className = "crit";
    div.innerHTML = `
      <div class="crit-top">
        <span class="crit-name">${c.label_he}</span>
        <span class="crit-val ${c.missing ? "miss" : ""}">${val}</span>
      </div>
      <div class="bar"><span style="width:${c.risk * 10}%;background:${riskColor(c.risk)}"></span></div>
      <div class="crit-foot">
        <span>משקל ${(c.weight * 100).toFixed(0)}% · תת-ציון ${c.risk}/10</span>
        <span>תרומה לסיכון: ${c.contribution.toFixed(2)}</span>
      </div>`;
    bd.appendChild(div);
  }

  const box = document.getElementById("explainBox");
  if (d.explanation) {
    box.style.display = "block";
    document.getElementById("explainText").textContent = d.explanation;
  } else { box.style.display = "none"; }
}

document.getElementById("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("submit");
  btn.disabled = true; btn.textContent = "מחשב…";
  try {
    const body = {
      customer: document.getElementById("customer").value,
      amount: Number(document.getElementById("amount").value),
      explain: true,
      use_ai: document.getElementById("use_ai").checked,
    };
    const res = await fetch("api/score", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) { const e = await res.json().catch(() => ({})); showError(e.detail || "שגיאה בחישוב"); }
    else { render(await res.json()); }
  } catch (e) { showError("שגיאת רשת: " + e.message); }
  finally { btn.disabled = false; btn.textContent = "חשב דירוג סיכון"; }
});

loadCustomers();
</script>
</body>
</html>
